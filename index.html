<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scylla Shop</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Первый экран с баннером -->
    <section class="hero">

        <div class="hero-content">
            <h1>SCYLLA</h1>
            <p>DIGITAL STORE</p>

            <button>
                Купить Robux
            </button>
        </div>

    </section>


    <!-- Каталог -->
    <section class="shop">

        <h2>Robux</h2>

        <div class="cards">

            <div class="card">
                <h3>100 Robux</h3>
                <p>120 ₽</p>
                <button>Купить</button>
            </div>


            <div class="card">
                <h3>500 Robux</h3>
                <p>550 ₽</p>
                <button>Купить</button>
            </div>


            <div class="card">
                <h3>1000 Robux</h3>
                <p>1100 ₽</p>
                <button>Купить</button>
            </div>

        </div>

    </section>


</body>

</html>
