<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scylla Shop</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="stars">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>



<!-- ПЕРВАЯ ЧАСТЬ -->

<section class="home" id="home">


<div class="logo">

<h1>SCYLLA</h1>

<p>ROBLOX STORE</p>


<button id="buy">
КУПИТЬ ROBUX
</button>


</div>


</section>





<!-- ВТОРАЯ ЧАСТЬ -->

<section class="shop" id="shop">


<div class="window">


<h2>SCYLLA SHOP</h2>



<div class="box">

<p>Сколько заплатишь?</p>


<div class="input">

<input id="rub" type="number" value="100" min="1">

<span>₽</span>

</div>


</div>



<div class="line"></div>




<div class="box">


<p>Сколько получишь?</p>


<h1>

<span id="robux">
120
</span>

R$

</h1>


</div>



<button>
ПРОДОЛЖИТЬ
</button>



</div>


</section>



<script src="script.js"></script>


</body>

</html>
